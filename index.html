<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小學中文粵語聆聽模擬卷</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .instructions {
            background-color: #e8f4f8;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .question-card {
            background-color: #fff;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .question-text {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 15px;
        }
        .options label {
            display: block;
            margin-bottom: 10px;
            padding: 10px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .options label:hover {
            background-color: #eef2f5;
        }
        input[type="radio"] {
            margin-right: 10px;
        }
        button {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        #result-container {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            color: #155724;
            text-align: center;
            font-size: 1.2em;
        }
        .correct-answer {
            color: #e74c3c;
            font-weight: bold;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <h1>小學中文粵語聆聽模擬卷</h1>
    
    <div class="instructions">
        <p><strong>指示：</strong>請先聆聽錄音內容（約5分鐘），然後回答以下20條選擇題。每題只有一個最適合的答案。完成後請點擊最下方的「提交答案」按鈕查看分數。</p>
    </div>

    <form id="quiz-form"></form>

    <button type="button" onclick="submitQuiz()">提交答案</button>

    <div id="result-container">
        <h2>你的分數是：<span id="score"></span> / 20</h2>
        <p>請查看上方題目核對正確答案（紅色字體為正確答案）。</p>
    </div>

    <script>
        const quizData = [
            { q: "秋季大旅行的最終舉辦日期是哪一天？", options: ["11月15日", "11月18日", "11月20日", "11月25日"], ans: 1 },
            { q: "今年秋季大旅行的目的地是哪裏？", options: ["西貢郊野公園", "大埔", "馬鞍山郊野公園", "香港濕地公園"], ans: 2 },
            { q: "學生在旅行當日需要在甚麼時間集合？", options: ["上午8:00", "上午8:15", "上午8:30", "上午8:45"], ans: 1 },
            { q: "旅行當日的集合地點在學校的哪裏？", options: ["課室", "操場", "禮堂", "校門外"], ans: 1 },
            { q: "陳老師提醒每位同學最少要帶多少食水？", options: ["500毫升", "1公升", "1.5公升", "2公升"], ans: 1 },
            { q: "旅行時「絕對不可以」帶以下哪一樣物品？", options: ["防曬霜", "毛巾", "電子遊戲機", "手提電話"], ans: 2 },
            { q: "手提電話在甚麼情況下才可以拿出來使用？", options: ["在車上感到無聊時", "需要拍照留念時", "與同學分享遊戲時", "緊急情況下聯絡家人時"], ans: 3 },
            { q: "如果旅行當天早上發出黃色暴雨警告，學校會有甚麼安排？", options: ["延期至下星期六", "改去博物館參觀", "穿着校服回校照常上課", "留在操場等待天氣好轉"], ans: 2 },
            { q: "義工探訪活動是在哪裏進行？", options: ["開心安老院", "西貢郊野公園", "學校禮堂", "社區中心"], ans: 0 },
            { q: "義工活動目前還欠缺多少名同學報名參加？", options: ["5名", "10名", "15名", "20名"], ans: 0 },
            { q: "義工活動在哪一天舉行？", options: ["11月15日星期三", "11月18日星期六", "11月20日星期一", "11月25日星期六"], ans: 3 },
            { q: "同學們最終決定買甚麼水果送給老人家？", options: ["蘋果和雪梨", "雪梨和香蕉", "蘋果和橙", "橙和香蕉"], ans: 2 },
            { q: "為甚麼陳老師說不要買雪梨送給老人家？", options: ["因為雪梨太昂貴", "因為老人家咬不動", "因為雪梨與「分離」同音，意頭不好", "因為雪梨很難買到"], ans: 2 },
            { q: "誰負責購買探訪活動所需的水果？", options: ["陳老師", "家明", "小華", "校長"], ans: 2 },
            { q: "探訪活動當天，同學們需要在甚麼地點集合？", options: ["學校操場", "老人院門口", "地鐵站A出口", "巴士站"], ans: 2 },
            { q: "探訪活動預計在下午幾點鐘結束？", options: ["下午1點鐘", "下午2點鐘", "下午4點鐘", "下午5點鐘"], ans: 2 },
            { q: "家明打算在老人院表演甚麼節目？", options: ["唱歌", "跳舞", "吹直笛", "變魔術"], ans: 3 },
            { q: "小華打算在老人院表演甚麼節目？", options: ["唱歌", "講故事", "吹直笛", "變魔術"], ans: 2 },
            { q: "在這段對話中，陳老師對家明和小華的態度是怎樣的？", options: ["嚴厲批評", "充滿鼓勵和讚賞", "不聞不問", "表示懷疑"], ans: 1 },
            { q: "這段對話最主要是在討論甚麼？", options: ["學校測驗的範圍", "購買水果的注意事項", "課外活動的收費問題", "學校旅行及老人院探訪活動的細節安排"], ans: 3 }
        ];

        const form = document.getElementById('quiz-form');

        // Render questions
        quizData.forEach((item, index) => {
            let optionsHtml = '';
            item.options.forEach((opt, optIndex) => {
                optionsHtml += `
                    <label>
                        <input type="radio" name="q${index}" value="${optIndex}">
                        ${opt}
                    </label>
                `;
            });

            form.innerHTML += `
                <div class="question-card" id="card-${index}">
                    <div class="question-text">${index + 1}. ${item.q}</div>
                    <div class="options">
                        ${optionsHtml}
                    </div>
                    <div class="correct-answer" id="ans-${index}">
                        正確答案：${item.options[item.ans]}
                    </div>
                </div>
            `;
        });

        function submitQuiz() {
            let score = 0;
            let allAnswered = true;

            quizData.forEach((item, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                const answerDiv = document.getElementById(`ans-${index}`);
                
                if (!selected) {
                    allAnswered = false;
                } else {
                    if (parseInt(selected.value) === item.ans) {
                        score++;
                        answerDiv.style.color = "#27ae60"; // Green for correct
                        answerDiv.innerHTML = "答對了！";
                    } else {
                        answerDiv.style.color = "#e74c3c"; // Red for wrong
                        answerDiv.innerHTML = `答錯了。正確答案應為：${item.options[item.ans]}`;
                    }
                }
                answerDiv.style.display = "block";
            });

            if (!allAnswered) {
                alert("請確保已回答所有問題！未作答的題目將被視作錯誤。");
            }

            document.getElementById('score').innerText = score;
            document.getElementById('result-container').style.display = "block";
            
            // Scroll to bottom
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }
    </script>
</body>
</html>
